<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Is My IP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
      }
      .card {
        background: white;
        padding: 3rem;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 480px;
        width: 90%;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        color: #2d3748;
      }
      .subtitle {
        color: #718096;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .ip-section {
        margin: 1.5rem 0;
      }
      .label {
        font-size: 0.85rem;
        color: #a0aec0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.3rem;
      }
      .ip {
        font-size: 2.2rem;
        font-weight: 700;
        color: #667eea;
        word-break: break-all;
      }
      .server-ip {
        font-size: 1.4rem;
        color: #764ba2;
      }
      .divider {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 1.5rem 0;
      }
      .loading {
        color: #a0aec0;
      }
      .error {
        color: #e53e3e;
        font-size: 0.9rem;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #a0aec0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>What Is My IP?</h1>
      <p class="subtitle">A simple Go web server to display IP addresses</p>

      <!-- Visitor's IP -->
      <div class="ip-section">
        <div class="label">Your IP Address</div>
        <div class="ip" id="my-ip">
          <span class="loading">Detecting...</span>
        </div>
      </div>

      <hr class="divider" />

      <!-- Server's Public IP -->
      <div class="ip-section">
        <div class="label">Server's Public IP</div>
        <div class="ip server-ip" id="server-ip">
          <span class="loading">Fetching...</span>
        </div>
      </div>

      <footer>Powered by go-simple</footer>
    </div>

    <script>
      // Fetch visitor's IP
      fetch("/api/my-ip")
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("my-ip").textContent = data.ip;
        })
        .catch(() => {
          document.getElementById("my-ip").innerHTML =
            '<span class="error">Unable to detect</span>';
        });

      // Fetch server's public IP
      fetch("/api/server-ip")
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("server-ip").textContent =
            data.ip || data.error;
        })
        .catch(() => {
          document.getElementById("server-ip").innerHTML =
            '<span class="error">Unavailable</span>';
        });
    </script>
  </body>
</html>
